name: pages

# Deploys docs/ (the feature page, its gallery under showcase/, images and shared assets) to GitHub Pages.
# Pages is enabled with GitHub Actions as the source; a push to main that touches docs/ deploys the site.
# docs/ is the site root, with index.html at the top and every link relative or
# absolute. It is staged into _site first, leaving out docs/superpowers/ (plans and specs) and docs/*.md
# (decisions-pending.md and other notes), so only the site is published.
# Triggers on a push to main that touches docs/, on a published release, or manually.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight release deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage the site
        run: rsync -a --exclude='superpowers/' --exclude='/*.md' docs/ _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
