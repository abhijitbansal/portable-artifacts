name: pages

# Deploys docs/ (the feature page, its gallery under showcase/, images and shared assets) to GitHub Pages.
# DORMANT until the owner enables Pages (Settings > Pages > Source: GitHub Actions); until then a run fails
# at the configure-pages step. docs/ is the site root, with index.html at the top and every link relative or
# absolute. It is staged into _site first, leaving out docs/superpowers/ (plans and specs) and docs/*.md
# (decisions-pending.md and other notes), so only the site is published.
# Triggers on a push to main that touches docs/, on a published release, or manually.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight release deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: rsync -a --exclude='superpowers/' --exclude='/*.md' docs/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
