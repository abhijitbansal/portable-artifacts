name: pages

# Deploys docs/ (the feature page, its gallery under showcase/, images and shared assets) to GitHub Pages.
# Pages is enabled with GitHub Actions as the source; a push to main that touches docs/ deploys the site.
# docs/ is the site root, with index.html at the top and every link relative or
# absolute. It is staged into _site first, leaving out docs/superpowers/ (plans and specs) and docs/*.md
# (decisions-pending.md and other notes), so only the site is published.
# The dashboard gallery's "source + data" ZIPs are built into _site after staging (scripts/build_dashboard_gallery.py),
# so a push that changes that script, the CSV fixtures it packs, or LICENSE also redeploys.
# Triggers on a push to main that touches docs/ or those inputs, on a published release, or manually.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_dashboard_gallery.py'
      - 'plugins/portable-artifacts/eval/fixtures/data/**'
      - 'LICENSE'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight release deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage the site
        run: rsync -a --exclude='superpowers/' --exclude='/*.md' docs/ _site/
      - name: Build dashboard gallery downloads
        run: python3 scripts/build_dashboard_gallery.py --out _site/showcase/portable-artifacts/gallery
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
