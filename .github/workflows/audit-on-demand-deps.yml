name: audit-on-demand-deps
# `npm audit` in a skill folder cannot see the packages installed on demand into <skill>/optional/<name>/
# (make-motion's voiceover and cutout stacks). This audits their lockfiles, on the PRs that change them and
# weekly, because new advisories land without any commit here.
on:
  pull_request:
    paths:
      - 'plugins/portable-artifacts/skills/make-motion/package.json'
      - 'plugins/portable-artifacts/skills/make-motion/package-lock.json'
      - 'plugins/portable-artifacts/skills/make-motion/optional/**'
      - 'plugins/portable-artifacts/shared/doctor.mjs'
      - 'scripts/audit-on-demand-deps.sh'
      - '.github/workflows/audit-on-demand-deps.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: audit the optional voice and cutout lockfiles
        run: bash scripts/audit-on-demand-deps.sh
