<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Video page</title></head>
<body>
<h1>Video page</h1>
<p>A canvas stream plays in the video below, so the page runs in real time.</p>
<canvas id="c" width="160" height="90"></canvas>
<video id="v" muted autoplay playsinline width="160" height="90"></video>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let n = 0;
setInterval(() => { ctx.fillStyle = `hsl(${(n += 7) % 360} 70% 50%)`; ctx.fillRect(0, 0, 160, 90); }, 40);
const video = document.getElementById('v');
video.srcObject = canvas.captureStream(25);
video.play().catch(() => {});
</script>
</body>
</html>
