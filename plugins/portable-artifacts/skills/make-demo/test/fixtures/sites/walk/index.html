<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Harbor: Projects</title>
<style>
  :root { --ink: #1c2530; --muted: #5d6b7a; --line: #dde3ea; --paper: #f6f8fa; --card: #ffffff; --accent: #2a6df4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { height: 56px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--line); }
  .brand { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); }
  .me { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #dbe7ff; color: #1c47a8; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  main { padding: 24px 32px; }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 650; letter-spacing: -0.015em; }
  .sub { margin: 0 0 20px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tab { appearance: none; border: 0; background: none; font: inherit; color: var(--muted); padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  .bar input { width: 280px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .bar input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .add { height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .card { appearance: none; text-align: left; font: inherit; color: inherit; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .card:hover { box-shadow: 0 6px 18px rgba(28, 37, 48, 0.14); border-color: #c4cfdb; }
  .card.match { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(42, 109, 244, 0.25); }
  .card.match:hover { box-shadow: 0 0 0 2px rgba(42, 109, 244, 0.25), 0 6px 18px rgba(28, 37, 48, 0.14); }
  .card span { display: block; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .count { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 2px; }
  .card .caption { font-size: 12px; color: var(--muted); }
  .card.entering { opacity: 0; transform: translateY(10px); }
  .card.entering.in { opacity: 1; transform: none; }
  .card.entering { transition: opacity 0.3s ease, transform 0.3s ease; }
  h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .feed { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .feed li { padding: 10px 16px; display: flex; justify-content: space-between; color: var(--ink); }
  .feed li + li { border-top: 1px solid var(--line); }
  .feed time { color: var(--muted); }
</style>
<header>
  <div class="brand"><div class="mark"></div>Harbor</div>
  <div class="me"><span>Studio plan</span><div class="avatar">AL</div></div>
</header>
<main>
  <h1>Projects</h1>
  <p class="sub" id="sub">Everything in flight, with what is still open.</p>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" aria-selected="true" data-sub="Everything in flight, with what is still open.">Overview</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-sub="What changed across your projects this week.">Activity</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-sub="Who is working on what.">People</button>
  </div>
  <div class="bar">
    <input type="search" aria-label="Search projects" placeholder="Search projects" id="q">
    <button type="button" class="add" id="add">Add project</button>
  </div>
  <div class="cards" id="cards">
    <button type="button" class="card" aria-label="Website refresh"><span class="name">Website refresh</span><span class="count">24</span><span class="caption">open tasks, 3 due this week</span></button>
    <button type="button" class="card" aria-label="Mobile onboarding"><span class="name">Mobile onboarding</span><span class="count">142</span><span class="caption">open tasks, 11 due this week</span></button>
    <button type="button" class="card" aria-label="Billing cleanup"><span class="name">Billing cleanup</span><span class="count">8</span><span class="caption">open tasks, none overdue</span></button>
  </div>
  <h2>Recent activity</h2>
  <ul class="feed">
    <li><span>Ada moved "Pricing page copy" to review</span><time>9:40</time></li>
    <li><span>Sam closed 6 tasks in Billing cleanup</span><time>9:12</time></li>
    <li><span>Priya commented on "Onboarding checklist"</span><time>Yesterday</time></li>
  </ul>
</main>
<script>
  const cards = document.getElementById('cards');
  const sub = document.getElementById('sub');
  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      for (const other of document.querySelectorAll('.tab')) other.setAttribute('aria-selected', String(other === tab));
      sub.textContent = tab.dataset.sub;
    });
  }
  const query = document.getElementById('q');
  query.addEventListener('input', () => {
    const wanted = query.value.trim();
    for (const card of cards.children) {
      const count = card.querySelector('.count').textContent.replace(/,/g, '');
      card.classList.toggle('match', wanted !== '' && count.includes(wanted));
    }
  });
  document.getElementById('add').addEventListener('click', () => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card entering';
    card.setAttribute('aria-label', 'Q1 planning');
    card.innerHTML = '<span class="name">Q1 planning</span><span class="count">0</span><span class="caption">open tasks, none due yet</span>';
    cards.append(card);
    card.getBoundingClientRect(); // start from the hidden state, then let the transition run
    card.classList.add('in');
  });
</script>
