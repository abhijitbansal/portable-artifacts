<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plain page</title>
<style>
  body { margin: 0; font: 20px/1.5 system-ui, sans-serif; color: #1c2430; background: #fbfaf7; }
  main { max-width: 900px; margin: 0 auto; padding: 48px 32px; }
  h1 { font-size: 44px; margin: 0 0 8px; }
  h2 { margin: 32px 0 8px; }
  .tall { height: 1400px; }
  a { color: #1b5fd1; }
</style>
</head>
<body>
<main>
  <h1>Plain page</h1>
  <p>A server-rendered page with headings, a plain link and a disclosure. Nothing here moves.</p>
  <h2>Reading list</h2>
  <p><a href="/plain/two">Go to the second page</a></p>
  <h2>Details</h2>
  <details>
    <summary>Show more</summary>
    <p>This text is revealed by the disclosure and sends no request.</p>
  </details>
  <div class="tall"></div>
  <h2>End of page</h2>
</main>
</body>
</html>
