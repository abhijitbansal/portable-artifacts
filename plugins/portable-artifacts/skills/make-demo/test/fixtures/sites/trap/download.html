<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A download after load</title></head>
<body>
<h1>A download after load</h1>
<script>
setTimeout(() => {
  const link = document.createElement('a');
  link.href = '/trap/file.txt';
  link.download = 'file.txt';
  document.body.append(link);
  link.click();
}, 600);
</script>
</body>
</html>
