<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>An article</title></head>
<body style="font: 18px/1.6 system-ui; margin: 24px">
<h1>An article</h1>
<script>
// A long page: enough text that no short-page rule applies. A consent notice then covers the view.
document.write('<p>' + 'The page has plenty of ordinary text, so it is not a short wall page. '.repeat(40) + '</p>');
</script>
<div role="dialog" aria-label="Consent" style="position: fixed; inset: 5%; background: #fff; border: 2px solid #333; padding: 24px; z-index: 10">
  <h2>Manage your consent</h2>
  <p>We value your privacy. Accept cookies to read on.</p>
  <button type="button">Accept all</button>
</div>
</body>
</html>
