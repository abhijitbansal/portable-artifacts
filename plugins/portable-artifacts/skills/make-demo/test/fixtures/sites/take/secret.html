<!doctype html>
<meta charset="utf-8">
<title>Secret fixture</title>
<style>
  body { font: 24px system-ui; margin: 20px; background: #fff; color: #000; }
  #card { width: 420px; height: 70px; padding: 8px; background: linear-gradient(90deg, #900, #006); color: #fff; }
  input { font: 20px system-ui; width: 360px; display: block; margin: 6px 0; }
</style>
<h1 id="title">Secret fixture</h1>
<div id="card">Card on file, holder A. Lovelace</div>
<p id="mail">Write to ada.lovelace@example.test today</p>
<p id="split"><b>split.person</b><i>@example.test</i></p>
<p>Order <span id="num">4111 1111 1111 1111</span> shipped; the short number 42 stays.</p>
<input id="pw" type="password" value="not-a-real-password" aria-label="Password">
<input id="mailfield" type="text" value="field.person@example.test" aria-label="Contact">
<input id="plain" type="text" value="plain words only" aria-label="Note">
<div id="host"></div>
<iframe id="inner" src="secret-frame.html" width="420" height="60" style="border:0"></iframe>
<script>
  document.getElementById('host').attachShadow({ mode: 'open' }).innerHTML = '<p id="shadow">shadow.person@example.test</p>';
</script>
