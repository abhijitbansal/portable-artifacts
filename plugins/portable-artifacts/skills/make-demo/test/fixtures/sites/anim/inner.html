<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inner frame</title>
<style>
  @keyframes slide { to { transform: translateX(300px); } }
  body { margin: 0; }
  .box { width: 20px; height: 20px; background: #1b5fd1; animation: slide 60s linear; }
</style>
</head>
<body><div class="box"></div></body>
</html>
